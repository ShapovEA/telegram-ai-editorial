use_default_settings: true

general:
  instance_name: ai-smm-search
  enable_metrics: false

server:
  secret_key: "ai-smm-searxng-secret"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  default_lang: ru
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 10

engines:
  - name: wikidata
    disabled: true
